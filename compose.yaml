services:
  omniquant:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniquant:0.1.0
    container_name: omniquant
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      APP_PORT: "8000"
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/omniquant.db
      AI_ENABLED: ${AI_ENABLED:-false}
      # Always use the Docker host gateway for OmniRoute. A .env value of
      # http://127.0.0.1:20128/v1 points at the container itself and breaks AI.
      AI_BASE_URL: ${AI_DOCKER_BASE_URL:-http://host.docker.internal:20128/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_FALLBACK_BASE_URL: ${AI_FALLBACK_BASE_URL:-https://openrouter.ai/api/v1}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount keeps SQLite + market-data cache on the host for evaluation persistence
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
